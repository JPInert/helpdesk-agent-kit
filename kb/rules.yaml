# Knowledge base for the demo help desk. Edit freely: no code change is needed to add a rule.
# See helpdesk_kit/kb.py for how matching, specificity and the three reply kinds work.
#
# Placeholders like ${product} are filled ONLY from evidence the run collected. If a value is
# missing the reply is not sent; the ticket goes to a human instead.

contacts:
  license-owner: licensing@example-corp.test
  hardware-vendor: support@hardware-vendor.test
  billing: billing@example-corp.test
  policy-owner: it-policy@example-corp.test
  access-team: access-team@example-corp.test
  manager: from_portal            # the affected person's manager, read from their account

rules:
  # ---- keyword rules: no record behind the ticket, matched before anything else -------------
  - id: hardware-vendor
    kind: handoff
    keywords: [printer, toner, docking station, monitor is flickering, laptop won't turn on]
    action: forward_vendor
    route_to_human: false
    confidence: HIGH
    cc: [hardware-vendor]
    reply: |
      Hi there,

      Thanks for letting us know. Hardware repairs are handled by our hardware vendor, so I have
      copied them in here and they will contact you to arrange the fix.

      If anything else stops working in the meantime, just reply on this ticket.

  # ---- record rules ------------------------------------------------------------------------
  - id: license-stuck
    kind: assert
    ticket_type: LICENSE_NOT_ASSIGNED
    state: job_stuck
    action: retry_job
    auto_execute: true
    route_to_human: false
    confidence: HIGH
    needs: [new_status]
    reply: |
      Hi there,

      Your ${product} request (${job_id}) had been stuck in the queue for ${waiting}. I re-ran it
      and it now shows as ${new_status}.

      Sign out and back in once and it should appear. If it does not, reply here and we will take
      another look.

  - id: access-stuck
    kind: assert
    ticket_type: ACCESS_PENDING
    state: job_stuck
    action: retry_job
    auto_execute: true
    route_to_human: false
    confidence: HIGH
    needs: [new_status]
    reply: |
      Hi there,

      Your request for ${product} (${job_id}) had been stuck for ${waiting}. I re-ran it and it now
      shows as ${new_status}. It can take a few minutes to reach every device.

      If you still cannot open it in 15 minutes, reply here and we will take another look.

  - id: access-stuck-for-someone
    kind: assert
    ticket_type: ACCESS_PENDING
    submitter: internal
    state: job_stuck
    action: retry_job
    auto_execute: true
    route_to_human: false
    confidence: HIGH
    needs: [new_status, person]
    reply: |
      Hi there,

      Thanks for flagging this for ${person}. Their request for ${product} (${job_id}) had been stuck
      for ${waiting}. I re-ran it and it now shows as ${new_status}.

      They may need to sign out and back in. If it is still missing in 15 minutes, reply here.

  - id: seat-pool-full
    kind: assert
    ticket_type: [LICENSE_NOT_ASSIGNED]
    state: seat_pool_exhausted
    route_to_human: false
    confidence: HIGH
    cc: [license-owner]
    reply: |
      Hi there,

      Your ${product} request could not go through because every seat is taken (${seats} in use).
      I am looping in our license owner to free up or add a seat. Your request will be re-run as
      soon as one is available.

  - id: still-processing
    kind: assert
    ticket_type: [LICENSE_NOT_ASSIGNED, ACCESS_PENDING]
    state: job_in_progress
    route_to_human: false
    confidence: HIGH
    reply: |
      Hi there,

      Your ${product} request (${job_id}) went in ${waiting} ago and is still processing. These
      usually finish within 30 minutes.

      If it has not shown up by then, reply here and we will check it for you.

  - id: account-suspended
    kind: assert
    ticket_type: [LOGIN_FAILED, LICENSE_NOT_ASSIGNED, ACCESS_PENDING, ACCOUNT_SUSPENDED]
    state: account_suspended
    route_to_human: false
    confidence: HIGH
    cc: [manager]
    reply: |
      Hi there,

      Your account is currently suspended, which blocks sign-in and any new access. Reactivation
      needs approval from your manager, so I am looping in ${manager} to confirm.

      Once they approve, we will reactivate the account and let you know here.

  - id: already-active
    kind: assert
    ticket_type: [LICENSE_NOT_ASSIGNED, ACCESS_PENDING]
    state: all_ok
    route_to_human: false
    confidence: HIGH
    reply: |
      Hi there,

      ${product} shows as active on your account (${job_id}). Sign out fully, then sign back in,
      and it should appear.

      If it is still missing after that, reply with a screenshot of what you see and we will dig in.

  - id: no-request-on-file
    kind: ask
    ticket_type: [LICENSE_NOT_ASSIGNED, ACCESS_PENDING]
    state: no_request_found
    route_to_human: false
    confidence: HIGH
    reply: |
      Hi there,

      I could not find a request for ${product} on your account. Could you reply with roughly when
      you asked for it and who approved it? Then we can get it set up.

  - id: billing-locked
    kind: handoff
    ticket_type: BILLING_QUESTION
    state: cycle_locked
    route_to_human: true
    cc: [billing]
    reply: |
      Hi there,

      That charge is on an invoice that has already gone out, so our billing team needs to review
      any change to it. I have copied them in and they will follow up on this ticket.

  - id: policy-question
    kind: handoff
    ticket_type: POLICY_QUESTION
    route_to_human: true
    cc: [policy-owner]
    reply: |
      Hi there,

      Good question. I am passing this to the team that owns that policy so you get a definite
      answer rather than a guess. They will reply on this ticket.

  # ---- session records: why an elevated-access session was rejected -----------------------------
  # States come from helpdesk_kit/diagnose.py. There is deliberately NO rule here for
  # overlapping_sessions or daily_max_exceeded: those reach the proposals queue instead.
  - id: session-never-ended
    kind: assert
    ticket_type: SESSION_REJECTED
    state: record_never_ended
    action: close_session
    auto_execute: true
    route_to_human: false
    confidence: HIGH
    needs: [new_status, last_activity]
    reply: |
      Hi there,

      Your ${resource} session ${record_id} was rejected because it never had an end time. The last
      activity on it was at ${last_activity}, so I set the end time there. It now shows as ${new_status}.

      If those hours look wrong, reply here and we will take another look.

  - id: session-outside-approval
    kind: assert
    ticket_type: SESSION_REJECTED
    state: outside_approval_dates
    route_to_human: false
    confidence: HIGH
    cc: [manager]
    reply: |
      Hi there,

      Your ${resource} session ${record_id} on ${session_date} was rejected because it falls outside
      approval ${approval_id}, which covers ${approval_window}. Sessions outside the approved dates
      cannot be accepted.

      If you still need access for that day, your manager can ask for the approval to be extended, so
      I have copied ${manager} in.

  - id: session-weekly-cap
    kind: assert
    ticket_type: SESSION_REJECTED
    state: weekly_cap_exceeded
    route_to_human: false
    confidence: HIGH
    cc: [manager]
    reply: |
      Hi there,

      Your ${resource} session ${record_id} was rejected because the week starting ${week_start} adds up
      to ${hours_logged} hours, which is over your allowance of ${weekly_allowance}.

      If you need more hours, your manager can ask for the allowance to be raised, so I have copied
      ${manager} in.

  - id: session-wrong-week-start
    kind: assert
    ticket_type: SESSION_REJECTED
    state: wrong_week_start
    route_to_human: true
    confidence: HIGH
    cc: [access-team]
    reply: |
      Hi there,

      Your approval counts weeks from ${week_start_day}, but the activity log counts them from Monday.
      That makes the week around ${session_date} look like ${hours_logged} hours against your allowance
      of ${weekly_allowance}. This is a mismatch in how the log counts, not an overrun on your side, so I
      have passed it to the access team to correct. They will reply on this ticket.

  - id: session-resource-not-approved
    kind: assert
    ticket_type: SESSION_REJECTED
    state: resource_not_approved
    route_to_human: true
    confidence: HIGH
    cc: [manager]
    reply: |
      Hi there,

      Your session ${record_id} was on ${resource}, which is not on approval ${approval_id}. That approval
      covers ${approved_resources}. Your manager can ask for ${resource} to be added, so I have copied
      ${manager} in and a person on the access team will confirm.

  # ---- catch-all: may ask, never assert -------------------------------------------------------
  - id: catch-all
    kind: ask
    ticket_type: "*"
    route_to_human: true
    reply: |
      Hi there,

      Thanks for reaching out. So we can look into this, could you reply with your username, what
      you were trying to do, and a screenshot of any error you see?
